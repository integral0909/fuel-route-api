name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - run: coverage run manage.py test fuelplanner
      - run: coverage report

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fuel-route-api .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci -e DJANGO_SECURE_SSL_REDIRECT=0 fuel-route-api
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/healthz && exit 0
            sleep 2
          done
          docker logs api
          exit 1
